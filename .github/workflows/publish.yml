name: Publish

on:
  release:
    types: [published]
  repository_dispatch:
    types: [publish]

env:
  PROJECT_PATH: src/Crowdin.Api
  PROJECT_CSPROJ_PATH: src/Crowdin.Api/Crowdin.Api.csproj

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 7.0.x

      - name: Build the project
        run: dotnet build -c Release ${{ env.PROJECT_CSPROJ_PATH }}

      - name: Create the package
        run: dotnet pack -c Release ${{ env.PROJECT_CSPROJ_PATH }}

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish the package to NuGet
        run: dotnet nuget push ${{ env.PROJECT_PATH }}/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
